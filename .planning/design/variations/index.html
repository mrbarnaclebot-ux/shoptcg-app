<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shoptcg variations</title>
<style>
  :root { --bg:#090911; --fg:#F3F5F8; --muted:#9A9FA6; --line:#373B40; --accent:#F77C10; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  header strong { margin-right:12px; }
  button { background:none; color:var(--fg); border:1px solid var(--line); padding:8px 12px; cursor:pointer; font:inherit; }
  button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  .tools { margin-left:auto; display:flex; gap:8px; align-items:center; color:var(--muted); }
  a { color:var(--accent); }
  .stage { flex:1; display:flex; justify-content:center; background:#000; overflow:hidden; }
  iframe { border:0; width:100%; height:100%; background:#fff; transition:width .2s; }
  .phone iframe { width:390px; }
  p.blurb { margin:0; padding:6px 16px 10px; color:var(--muted); border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <strong>shoptcg: pick a direction</strong>
  <button data-v="0" aria-pressed="true">1 Editorial collector</button>
  <button data-v="1">2 Tactile table</button>
  <button data-v="2">3 Show floor</button>
  <button data-v="3">4 Market board</button>
  <span class="tools">
    <label><input type="checkbox" id="phone"> Phone width</label>
    <a id="open" href="#" target="_blank">Open full tab</a>
  </span>
</header>
<p class="blurb" id="blurb"></p>
<main class="stage" id="stage"><iframe id="frame" title="Variation preview"></iframe></main>
<script>
  const v = [
    ["v1-editorial/index.html", "Printed price guide: serif lots on warm paper, real table photography, dark reversed seller side."],
    ["v2-tactile/index.html", "Built from vendor-table objects: felt playmat, penny sleeves, top-loaders, handwritten price stickers."],
    ["v3-showfloor/index.html", "Card show after dark: documentary hall photography, ticket-stub requests and receipts, table-number wayfinding."],
    ["v4-board/index.html", "Live departure board: split-flap prices that flip on change, studio product shots, receipt-slot toasts."],
  ];
  const frame = document.getElementById("frame"), open = document.getElementById("open"), blurb = document.getElementById("blurb");
  function show(i) {
    frame.src = v[i][0]; open.href = v[i][0]; blurb.textContent = v[i][1];
    document.querySelectorAll("button[data-v]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v == i)));
  }
  document.querySelectorAll("button[data-v]").forEach(b => b.onclick = () => show(+b.dataset.v));
  document.getElementById("phone").onchange = e => document.getElementById("stage").classList.toggle("phone", e.target.checked);
  show(0);
</script>
</body>
</html>
